name: EHUNAM held-room binary experiment
on:
  push:
    branches: [experiment/ehunam-inspection]
    paths: [.github/workflows/ehunam-room.yml]
jobs:
  rooms:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: pip install requests remotezip pandas openpyxl scipy scikit-learn zipfile64
      - run: |
          python - <<'PY'
          import io, requests, pandas as pd, numpy as np, scipy.io as sio
          import zipfile64.zipfile
          from remotezip import RemoteZip
          from sklearn.ensemble import RandomForestClassifier
          from sklearn.metrics import accuracy_score,balanced_accuracy_score, confusion_matrix
          files=requests.get("https://api.figshare.com/v2/articles/28541225",timeout=60).json()["files"]
          x=next(f for f in files if f["name"]=="Summary.xlsx")
          zf=next(f for f in files if f["name"]=="EHUNAM.zip")
          df=pd.read_excel(io.BytesIO(requests.get(x["download_url"],timeout=60).content))
          rooms=["Classroom","Office 1","Laboratory","Storage Room"]
          df=df[(df.Enviroment.isin(rooms)) & (df.Application.isin(["PC","E"])) & (df.Rx==1)]
          df=df.copy(); df["binary"]=(df.N_People>0).astype(int)
          df=df.groupby(["Enviroment","binary"],group_keys=False).head(12)
          print("SELECTED",df.groupby(["Enviroment","binary"]).size().to_string(),flush=True)
          rows=[]
          with RemoteZip(zf["download_url"],timeout=120) as z:
              for i,row in enumerate(df.itertuples()):
                  c=np.abs(sio.loadmat(io.BytesIO(z.read(row.File)))["CSI"].astype(np.complex128))
                  c=c[:, np.any(c != 0,axis=0)]
                  c=c/np.maximum(c.mean(axis=1,keepdims=True),1e-12)
                  d=np.abs(np.diff(c,axis=0))
                  feat=np.r_[np.quantile(c,[.05,.25,.5,.75,.95]),np.std(c),np.quantile(d,[.25,.5,.75,.95]),np.mean(d),np.std(d)]
                  if np.isfinite(feat).all(): rows.append((row.Enviroment,row.binary,row.Original_File,feat))
                  if i%20==0: print("LOADED",i,flush=True)
          for room in rooms:
              tr=[a for a in rows if a[0]!=room]; te=[a for a in rows if a[0]==room]
              assert len(set(a[1] for a in te))==2
              model=RandomForestClassifier(n_estimators=200,min_samples_leaf=3,random_state=42,n_jobs=-1)
              model.fit([a[3] for a in tr],[a[1] for a in tr])
              pred=model.predict([a[3] for a in te]); yt=[a[1] for a in te]
              print("ROOM",room,"train",len(tr),"test",len(te),"accuracy",accuracy_score(yt,pred),"balanced",balanced_accuracy_score(yt,pred),"confusion",confusion_matrix(yt,pred,labels=[0,1]).tolist(),flush=True)
          PY
