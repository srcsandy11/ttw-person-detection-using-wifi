name: Inspect EHUNAM data
on:
  push:
    branches: [experiment/ehunam-inspection]
    paths: [.github/workflows/ehunam-inspect.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: pip install requests remotezip pandas openpyxl scipy h5py
      - name: Inspect recordings
        run: |
          python - <<'PY'
          import io, requests, pandas as pd, scipy.io as sio
          from remotezip import RemoteZip
          files=requests.get("https://api.figshare.com/v2/articles/28541225").json()["files"]
          x=next(f for f in files if f["name"]=="Summary.xlsx")
          zf=next(f for f in files if f["name"]=="EHUNAM.zip")
          df=pd.read_excel(io.BytesIO(requests.get(x["download_url"]).content))
          pc=df[df.Application.isin(["PC","E"])]
          print("GROUPS", pc.groupby(["Enviroment","Date","N_People"]).Original_File.nunique().to_string(), flush=True)
          print("SAMPLE",pc[pc.Application=="PC"].head(10).to_string(),flush=True)
          with RemoteZip(zf["download_url"],timeout=120) as z:
              row=pc[pc.Application=="PC"].iloc[0]
              print("READING",row.File,flush=True)
              data=z.read(row.File)
              print("SIZE",len(data),flush=True)
              try:
                  m=sio.loadmat(io.BytesIO(data))
                  print("MAT",[(k,getattr(v,"shape",None),getattr(v,"dtype",None)) for k,v in m.items()],flush=True)
              except Exception as e:
                  print("MAT ERROR",repr(e),flush=True)
          PY
