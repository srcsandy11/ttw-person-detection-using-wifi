name: Inspect EHUNAM data
on:
  push:
    branches: [experiment/ehunam-inspection]
    paths: [.github/workflows/ehunam-inspect.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: pip install requests remotezip pandas openpyxl
      - name: Inspect capture metadata and archive
        run: |
          python - <<'PY'
          import io, requests, pandas as pd
          from remotezip import RemoteZip
          article=requests.get("https://api.figshare.com/v2/articles/28541225", timeout=60)
          article.raise_for_status()
          files=article.json()["files"]
          for f in files:
              print("FILE",f["name"],f["size"],f["download_url"], flush=True)
          for f in files:
              if f["name"].lower().endswith(".xlsx"):
                  response=requests.get(f["download_url"], timeout=120)
                  response.raise_for_status()
                  df=pd.read_excel(io.BytesIO(response.content))
                  print("COLUMNS",list(df.columns), "ROWS",len(df),flush=True)
                  print(df.head(5).to_string(),flush=True)
                  for c in df.columns:
                      if any(s in c.lower() for s in ["application","enviro","people","date","person"]):
                          print("VALUES",c,df[c].value_counts(dropna=False).head(30).to_string(),flush=True)
              if f["name"].lower().endswith(".zip"):
                  with RemoteZip(f["download_url"], timeout=120) as z:
                      names=z.namelist()
                      print("ZIP",len(names),names[:20],flush=True)
          PY
